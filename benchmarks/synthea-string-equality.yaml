cases:
  - name: synthea uses content equality for a required fallback transition
    rule: {tool: ast-grep, id: java-string-equality-with-eq}
    evidence:
      kind: historical
      source: https://github.com/synthetichealth/synthea/commit/8059a3083bbaaa63c744a4f8b94109ecc25df82c
      license: Apache-2.0
      rationale: >-
        An identity comparison against the empty literal misses other empty
        strings. The fix uses isEmpty after the null check.
    before:
      commit: a3d4ab455b398eea6be762c2455b09f929dd60c8
      path: src/main/java/org/mitre/synthea/engine/State.java
      lines: [394]
    after:
      commit: 8059a3083bbaaa63c744a4f8b94109ecc25df82c
      path: src/main/java/org/mitre/synthea/engine/State.java
      lines: []
  - name: synthea compares network and administration codes by value
    rule: {tool: ast-grep, id: java-string-equality-with-eq}
    evidence:
      kind: historical
      source: https://github.com/synthetichealth/synthea/commit/8059a3083bbaaa63c744a4f8b94109ecc25df82c
      license: Apache-2.0
      rationale: >-
        The exporter used identity checks for the network status and source
        administration code. The fix calls equals on the string literals.
    before:
      commit: a3d4ab455b398eea6be762c2455b09f929dd60c8
      path: src/main/java/org/mitre/synthea/export/CPCDSExporter.java
      lines: [1105, 1108, 1115]
    after:
      commit: 8059a3083bbaaa63c744a4f8b94109ecc25df82c
      path: src/main/java/org/mitre/synthea/export/CPCDSExporter.java
      lines: []
  - name: synthea checks the gender attribute by value
    rule: {tool: ast-grep, id: java-string-equality-with-eq}
    evidence:
      kind: historical
      source: https://github.com/synthetichealth/synthea/commit/8059a3083bbaaa63c744a4f8b94109ecc25df82c
      license: Apache-2.0
      rationale: >-
        The previous guard compared the attribute and literal by identity. The
        fixed guard compares the contents and preserves null safety.
    before:
      commit: a3d4ab455b398eea6be762c2455b09f929dd60c8
      path: src/main/java/org/mitre/synthea/world/concepts/BirthStatistics.java
      lines: [95]
