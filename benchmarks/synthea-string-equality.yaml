cases:
  - name: synthea uses content equality for a required fallback transition
    rule: &rule {tool: ast-grep, id: java-string-equality-with-eq}
    evidence: &evidence
      kind: historical
      source: https://github.com/synthetichealth/synthea/commit/8059a3083bbaaa63c744a4f8b94109ecc25df82c
      license: Apache-2.0
      rationale: >-
        Identity checks could miss equal strings in the fallback transition,
        network and administration codes, and gender guard. The fix uses
        content comparisons and keeps the relevant null checks.
