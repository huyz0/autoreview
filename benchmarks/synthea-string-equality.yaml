cases:
  - name: synthea uses content equality for a required fallback transition
    rule: &rule {tool: ast-grep, id: java-string-equality-with-eq}
    evidence:
      kind: historical
      source: &source https://github.com/synthetichealth/synthea/commit/8059a3083bbaaa63c744a4f8b94109ecc25df82c
      license: &license Apache-2.0
      rationale: >-
        An identity comparison against the empty literal misses other empty
        strings. The fix uses isEmpty after the null check.
    before: {commit: &before a3d4ab455b398eea6be762c2455b09f929dd60c8, path: &file1 src/main/java/org/mitre/synthea/engine/State.java, lines: [394]}
    after: {commit: &after 8059a3083bbaaa63c744a4f8b94109ecc25df82c, path: *file1, lines: []}
  - name: synthea compares network and administration codes by value
    rule: *rule
    evidence:
      kind: historical
      source: *source
      license: *license
      rationale: >-
        The exporter used identity checks for the network status and source
        administration code. The fix calls equals on the string literals.
    before: {commit: *before, path: &file2 src/main/java/org/mitre/synthea/export/CPCDSExporter.java, lines: [1105, 1108, 1115]}
    after: {commit: *after, path: *file2, lines: []}
  - name: synthea checks the gender attribute by value
    rule: *rule
    evidence:
      kind: historical
      source: *source
      license: *license
      rationale: >-
        The previous guard compared the attribute and literal by identity. The
        fixed guard compares the contents and preserves null safety.
    before: {commit: *before, path: &file3 src/main/java/org/mitre/synthea/world/concepts/BirthStatistics.java, lines: [95]}
    after: {commit: *after, path: *file3, lines: []}
