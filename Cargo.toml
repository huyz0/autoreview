[workspace]
resolver = "2"
members = [
    "crates/schema",
    "crates/core",
    "crates/archgraph",
    "crates/symindex",
    "crates/langsupport",
    "crates/dataflow",
    "crates/cli",
    "crates/test-support",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
tree-sitter = "0.26.11"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-kotlin-ng = "1.1.0"

[profile.release]
lto = true
