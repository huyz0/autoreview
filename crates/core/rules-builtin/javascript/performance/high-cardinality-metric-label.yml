id: js-prom-client-high-cardinality-label
language: JavaScript
category: performance
severity: warning
semantic: true
message: >-
  This Prometheus label looks like an unbounded identifier. Each distinct label
  combination creates a time series. Keep metric labels bounded and put
  per-request identifiers in traces or logs.
metadata:
  subcategory: [observability.metric-cardinality]
  references:
    - https://prometheus.io/docs/practices/naming/#labels
rule:
  all:
    - kind: new_expression
    - has:
        field: constructor
        pattern: $CLIENT.$METER
    - inside:
        kind: program
        has:
          any:
            - pattern: import * as $CLIENT from 'prom-client';
            - pattern: import $CLIENT from 'prom-client';
            - pattern: const $CLIENT = require('prom-client');
            - pattern: import * as $CLIENT from '@prometheus-io/client';
          stopBy: end
        stopBy: end
    - has:
        field: arguments
        has:
          kind: object
          has:
            kind: pair
            has:
              field: key
              regex: '^labelNames$'
            all:
              - has:
                  field: value
                  has:
                    kind: string
                    regex: >-
                      (?i)^(?:"|')(?:user[_.-]?id|request[_.-]?id|trace[_.-]?id|span[_.-]?id|session[_.-]?id|email|uuid)(?:"|')$
                    stopBy: end
constraints:
  METER:
    regex: '^(Counter|Gauge|Histogram|Summary)$'
