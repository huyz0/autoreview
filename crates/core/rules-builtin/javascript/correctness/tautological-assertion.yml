id: js-tautological-assertion
language: JavaScript
category: correctness
severity: warning
semantic: true
message: >-
  This assertion compares the same variable on both sides. Assert against
  an independent expected value so the test can detect incorrect behavior.
rule:
  pattern: expect($VALUE).$ASSERT($VALUE)
constraints:
  VALUE:
    kind: identifier
  ASSERT:
    regex: '^to(Be|Equal|StrictEqual)$'
