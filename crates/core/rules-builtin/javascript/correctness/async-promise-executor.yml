id: js-async-promise-executor
language: JavaScript
category: correctness
severity: warning
message: >-
  An async Promise executor returns a promise that the constructor ignores.
  Errors from that executor can leave the outer promise pending. Use an async
  function directly, or keep the executor synchronous and forward errors to reject.
metadata:
  references:
    - https://eslint.org/docs/latest/rules/no-async-promise-executor
rule:
  kind: new_expression
  has:
    field: constructor
    regex: '^(Promise|globalThis\.Promise)$'
  all:
    - has:
        field: arguments
        has:
          any:
            - kind: arrow_function
            - kind: function_expression
          regex: '^async(?:\s*\(|\s+[$A-Za-z_])'
