id: javascript-prototype-pollution
language: JavaScript
category: security
severity: error
message: "Assigning directly to `__proto__` mutates the prototype every object of that shape inherits from — if the key/value being assigned is ever influenced by user input (e.g. a recursive merge/clone over a parsed JSON body), an attacker can inject `__proto__` as a key and pollute `Object.prototype` itself, affecting unrelated code across the whole process. Use `Object.create(null)`/`Map` for user-controlled key/value data, or `Object.defineProperty` with an explicit allowlist of keys instead of a bare assignment."
metadata:
  cwe: ["CWE-1321"]
  owasp: ["A03:2021"]
  confidence: HIGH
  references:
    - "https://cwe.mitre.org/data/definitions/1321.html"
rule:
  any:
    - pattern: $OBJ.__proto__ = $VAL
    - pattern: $OBJ["__proto__"] = $VAL
