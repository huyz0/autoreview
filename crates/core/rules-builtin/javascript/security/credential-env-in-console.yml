id: js-credential-env-in-console
language: JavaScript
category: security
severity: warning
message: >-
  This console call prints an environment variable named like a credential. Remove the value from the log entry.
metadata:
  cwe: ["CWE-532"]
  references:
    - "https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html#data-to-exclude"
rule:
  pattern: console.$METHOD($$$BEFORE, process.env.$NAME, $$$AFTER)
constraints:
  METHOD:
    regex: '^(log|debug|info|warn|error|trace)$'
  NAME:
    regex: '(^|_)(PASSWORD|PASSWD|SECRET|SECRET_KEY|TOKEN|API_KEY|PRIVATE_KEY)$'
