id: rust-slice-membership-per-iteration
language: Rust
category: performance
severity: info
semantic: true
message: >-
  This loop may scan the same slice for each input element. Consider a HashSet built once
  before the loop when hashing preserves the intended equality and the slice stays
  unchanged.
metadata:
  references:
    - "https://doc.rust-lang.org/std/collections/index.html#cost-of-collection-operations"
rule:
  all:
    - pattern: $HAYSTACK.contains($ITEM)
    - inside:
        pattern: for $ITEM in $INPUT { $$$BODY }
        stopBy:
          any:
            - kind: closure_expression
            - kind: function_item
    - inside:
        kind: function_item
        has:
          field: parameters
          has:
            kind: parameter
            all:
              - has:
                  field: pattern
                  pattern: $HAYSTACK
              - has:
                  field: type
                  regex: '^&\s*\['
        stopBy:
          any:
            - kind: closure_expression
            - kind: function_item
constraints:
  HAYSTACK:
    kind: identifier
  ITEM:
    kind: identifier
