id: rust-overlapping-recursive-steps
language: Rust
category: performance
severity: info
semantic: true
message: >-
  The n - 1 and n - 2 recursive calls revisit the same smaller inputs. For large inputs,
  compute the recurrence iteratively or memoize by input when reusing the result preserves
  behavior.
metadata:
  references:
    - "https://www.ocw.mit.edu/courses/6-006-introduction-to-algorithms-fall-2011/resources/lecture-19-dynamic-programming-i-fibonacci-shortest-paths/"
rule:
  any:
    - pattern: "fn $F($N: u64) -> u64 { if $N <= 1 { return $N; } $F($N - 1) + $F($N - 2) }"
  inside:
    any:
      - kind: source_file
      - kind: declaration_list
        inside:
          kind: mod_item
