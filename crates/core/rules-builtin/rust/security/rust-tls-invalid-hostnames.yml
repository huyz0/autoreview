id: rust-tls-invalid-hostnames
language: Rust
category: security
severity: warning
message: >-
  This TLS client accepts certificates issued for a different hostname.
  Keep hostname verification enabled and use a certificate issued for the
  hostname the client connects to.
metadata:
  cwe: [CWE-297]
  confidence: HIGH
  references:
    - https://docs.rs/reqwest/latest/reqwest/struct.ClientBuilder.html#method.tls_danger_accept_invalid_hostnames
    - https://docs.rs/native-tls/latest/native_tls/struct.TlsConnectorBuilder.html#method.danger_accept_invalid_hostnames
rule:
  any:
    - pattern: reqwest::Client::builder().$METHOD(true).build()
    - pattern: reqwest::blocking::Client::builder().$METHOD(true).build()
    - pattern: native_tls::TlsConnector::builder().danger_accept_invalid_hostnames(true).build()
constraints:
  METHOD:
    kind: field_identifier
    regex: '^(tls_)?danger_accept_invalid_hostnames$'
