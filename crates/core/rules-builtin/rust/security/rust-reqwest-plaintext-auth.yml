id: rust-reqwest-plaintext-auth
language: Rust
category: security
severity: warning
message: >-
  This authenticated request uses plain HTTP, which does not encrypt the
  credentials. Use an HTTPS URL for the request.
metadata:
  cwe: [CWE-319]
  confidence: HIGH
  references:
    - https://docs.rs/reqwest/latest/reqwest/struct.RequestBuilder.html#method.basic_auth
    - https://docs.rs/reqwest/latest/reqwest/struct.RequestBuilder.html#method.bearer_auth
    - https://www.rfc-editor.org/rfc/rfc7617.html#section-4
    - https://www.rfc-editor.org/rfc/rfc6750.html#section-5.2
rule:
  any:
    - pattern: $ASYNC().$REQUEST($URL).$AUTH($$$CREDENTIALS).send().await
    - pattern: $BLOCKING().$REQUEST($URL).$AUTH($$$CREDENTIALS).send()
constraints:
  ASYNC:
    regex: '^(::\s*)?reqwest\s*::\s*Client\s*::\s*new$'
  BLOCKING:
    regex: '^(::\s*)?reqwest\s*::\s*blocking\s*::\s*Client\s*::\s*new$'
  REQUEST:
    kind: field_identifier
    regex: '^(get|head|post|put|delete|patch)$'
  AUTH:
    kind: field_identifier
    regex: '^(basic_auth|bearer_auth)$'
  URL:
    kind: string_literal
    any:
      - regex: '^"(?i:http://)(?:[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?\.)+[A-Za-z][A-Za-z0-9-]*\.?(?::[0-9]+)?(?:[/?#][^"\\]*)?"$'
      - regex: '^"(?i:http://)(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9][0-9]?)(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}(?::[0-9]+)?(?:[/?#][^"\\]*)?"$'
    not:
      any:
        - regex: '^"(?i:http://(?:[^"/\\?#:@]+\.)?localhost)\.?(?:[/:?#]|"$)'
        - regex: '^"(?i:http://)127\.'
