id: rust-tls-invalid-certificates
language: Rust
category: security
severity: warning
message: >-
  This TLS client accepts invalid certificates. Keep certificate verification
  enabled and configure a trusted root certificate for a private service.
metadata:
  cwe: [CWE-295]
  confidence: HIGH
  references:
    - https://docs.rs/reqwest/latest/reqwest/struct.ClientBuilder.html#method.tls_danger_accept_invalid_certs
    - https://docs.rs/native-tls/latest/native_tls/struct.TlsConnectorBuilder.html#method.danger_accept_invalid_certs
rule:
  any:
    - pattern: reqwest::Client::builder().$METHOD(true).build()
    - pattern: reqwest::blocking::Client::builder().$METHOD(true).build()
    - pattern: native_tls::TlsConnector::builder().danger_accept_invalid_certs(true).build()
constraints:
  METHOD:
    kind: field_identifier
    regex: '^(tls_)?danger_accept_invalid_certs$'
