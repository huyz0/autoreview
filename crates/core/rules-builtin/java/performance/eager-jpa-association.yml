id: java-eager-jpa-association
language: Java
category: performance
severity: warning
message: "@ManyToOne/@OneToOne default to FetchType.EAGER in JPA, silently loading the related entity every time this one loads — declare fetch = FetchType.LAZY unless the association is genuinely always needed."
rule:
  any:
    - pattern: "@ManyToOne"
    - pattern: "@OneToOne"
