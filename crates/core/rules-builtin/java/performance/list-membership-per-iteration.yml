id: java-list-membership-per-iteration
language: Java
category: performance
severity: info
semantic: true
message: >-
  This loop can scan the same list for each element of the input. Consider a set built once
  before the loop when the searched list stays unchanged and the lookup happens often.
metadata:
  references:
    - "https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/ArrayList.html"
rule:
  all:
    - pattern: $HAYSTACK.contains($ITEM)
    - inside:
        pattern:
          context: 'class Sample { void run() { for ($T $ITEM : $INPUT) { $$$BODY } } }'
          selector: enhanced_for_statement
        stopBy:
          any:
            - kind: lambda_expression
            - kind: method_declaration
    - inside:
        kind: method_declaration
        has:
          field: parameters
          has:
            kind: formal_parameter
            all:
              - has:
                  field: name
                  pattern: $HAYSTACK
              - has:
                  field: type
                  regex: '^java\.util\.ArrayList\s*(<|$)'
        stopBy:
          any:
            - kind: lambda_expression
            - kind: method_declaration
constraints:
  HAYSTACK:
    kind: identifier
  ITEM:
    kind: identifier
