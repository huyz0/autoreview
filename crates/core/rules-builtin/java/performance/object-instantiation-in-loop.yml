id: java-object-instantiation-in-loop
language: Java
category: performance
semantic: true
severity: warning
message: An object is constructed on every loop iteration — if it's stateless/reusable (a formatter, a parser, a compiled pattern), hoist the construction outside the loop so it only happens once.
rule:
  pattern:
    context: "class W { void w() { $T $V = new $C($$$ARGS); } }"
    selector: local_variable_declaration
  inside:
    kind: for_statement
    stopBy: end
