id: java-retry-max-attempts-unbounded
language: Java
category: correctness
severity: warning
message: >-
  This Resilience4j retry budget allows billions of attempts. Set a small bound that fits the caller's deadline and the downstream service's capacity.
metadata:
  references:
    - "https://resilience4j.readme.io/docs/retry"
rule:
  any:
    - pattern: io.github.resilience4j.retry.RetryConfig.custom().maxAttempts(Integer.MAX_VALUE)
    - all:
        - pattern: RetryConfig.custom().maxAttempts(Integer.MAX_VALUE)
        - inside:
            kind: program
            has:
              pattern: import io.github.resilience4j.retry.RetryConfig;
            stopBy: end
