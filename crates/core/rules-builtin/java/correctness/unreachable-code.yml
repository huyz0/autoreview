id: java-unreachable-code
language: Java
category: correctness
severity: warning
message: This statement immediately follows a return/throw/System.exit in the same block — it can never execute. Remove it, or move it before the terminating statement if it was meant to run first.
rule:
  any:
    - kind: expression_statement
    - kind: local_variable_declaration
    - kind: if_statement
    - kind: for_statement
    - kind: while_statement
    - kind: return_statement
    - kind: throw_statement
  follows:
    stopBy: neighbor
    any:
      - kind: return_statement
      - kind: throw_statement
      - kind: expression_statement
        regex: ^System\.exit\(
