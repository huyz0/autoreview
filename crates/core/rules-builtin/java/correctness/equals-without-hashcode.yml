id: java-equals-without-hashcode
language: Java
category: correctness
severity: warning
message: This class overrides `equals()` but not `hashCode()` — breaks the equals/hashCode contract (Effective Java Item 11), so instances silently behave incorrectly in `HashMap`/`HashSet`/any hash-based collection. Add a matching `hashCode()` override.
rule:
  kind: class_declaration
  all:
    - has:
        stopBy: end
        kind: method_declaration
        has:
          kind: identifier
          regex: ^equals$
    - not:
        has:
          stopBy: end
          kind: method_declaration
          has:
            kind: identifier
            regex: ^hashCode$
