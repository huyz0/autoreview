id: java-completable-future-unobserved
language: Java
category: correctness
severity: warning
kind: call-sequence
semantic: true
message: "This locally owned CompletableFuture can outlive the method without its completion being observed. Join it or transfer the future to the caller."
metadata:
  subcategory: [concurrency.task-lifecycle]
  references: ["https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/CompletableFuture.html"]
contract:
  mode: must-complete
  import: java.util.concurrent.CompletableFuture
  methods: [runAsync, supplyAsync]
  borrows: [isDone, isCancelled, isCompletedExceptionally]
unless:
  - call: join
