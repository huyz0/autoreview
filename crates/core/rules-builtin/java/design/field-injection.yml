id: java-field-injection
language: Java
category: design
severity: warning
message: "`@Autowired`/`@Inject`/`@Resource` on a field hides the class's real dependencies (they're not visible from the constructor signature), makes the class impossible to instantiate without a DI container, and allows constructing it in a partially-initialized state. Use constructor injection instead."
rule:
  kind: field_declaration
  has:
    stopBy: end
    any:
      - kind: marker_annotation
        regex: (Autowired|Inject|Resource)
      - kind: annotation
        regex: (Autowired|Inject|Resource)
