id: java-interface-is-type
language: Java
category: design
severity: warning
message: This interface declares only constants and no methods — using interface inheritance to import constants into implementing classes pollutes their public API with unrelated names and leaks an implementation detail (Effective Java Item 22). Use a `final` utility class with `private` constructor and `static final` fields, or a Java `enum`, instead.
rule:
  kind: interface_declaration
  all:
    - has: {stopBy: end, kind: constant_declaration}
    - not: {has: {stopBy: end, kind: method_declaration}}
