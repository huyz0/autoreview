id: java-insecure-deserialization
language: Java
category: security
severity: warning
message: "Deserializing untrusted input can execute arbitrary code via a gadget chain: raw `ObjectInputStream.readObject()` (unless a class allowlist via `ObjectInputFilter` is configured), Jackson's `ObjectMapper.enableDefaultTyping()`/`activateDefaultTyping()` (globally enables polymorphic type resolution from the input itself — Jackson's own docs call this pattern dangerous), or SnakeYAML's default `new Yaml().load(...)` (constructs arbitrary Java objects from YAML tags unless built with a `SafeConstructor`). Verify the source is trusted, or use a restricted/allowlisted deserializer instead."
metadata:
  cwe: ["CWE-502"]
  owasp: ["A08:2021"]
  confidence: HIGH
  references:
    - "https://cwe.mitre.org/data/definitions/502.html"
rule:
  any:
    - pattern: $OIS.readObject()
    - pattern: $MAPPER.enableDefaultTyping($$$ARGS)
    - pattern: $MAPPER.activateDefaultTyping($$$ARGS)
    - pattern: new Yaml().load($$$ARGS)
