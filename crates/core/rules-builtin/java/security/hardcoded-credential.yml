id: java-hardcoded-credential
language: Java
category: security
severity: warning
message: A string literal is assigned directly to a variable named like a credential — hardcoded secrets should come from an environment variable or a secret manager instead of source code.
rule:
  pattern: String $NAME = "$VALUE";
constraints:
  NAME:
    regex: (?i)(password|passwd|secret|apikey|api_key|token)
