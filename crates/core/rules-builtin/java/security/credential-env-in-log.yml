id: java-credential-env-in-log
language: Java
category: security
severity: warning
message: >-
  This logging call receives an environment variable named like a credential. Remove its value from the log entry.
metadata:
  cwe: ["CWE-532"]
  references:
    - "https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html#data-to-exclude"
rule:
  kind: method_invocation
  all:
    - any:
        - all:
            - has:
                field: object
                regex: '^System\.(out|err)$'
            - has:
                field: name
                regex: '^(print|println|printf|format)$'
        - all:
            - has:
                field: object
                pattern: System.getLogger($LOGGER)
            - has:
                field: name
                regex: '^log$'
    - has:
        field: arguments
        has:
          pattern: System.getenv($KEY)
constraints:
  KEY:
    regex: '^"(?:[A-Z0-9_]+_)?(PASSWORD|PASSWD|SECRET|SECRET_KEY|TOKEN|API_KEY|PRIVATE_KEY)"$'
