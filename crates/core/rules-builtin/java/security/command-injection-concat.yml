id: java-command-injection-concat
language: Java
category: security
severity: error
message: "A shell command built via string concatenation is vulnerable to command injection — pass arguments as a separate array/list instead of concatenating untrusted input into a single command string. `ProcessBuilder(\"sh\"/\"bash\", \"-c\", ...)` explicitly hands the final argument to a shell, so a concatenated string there is just as dangerous as `Runtime.exec` with one — `ProcessBuilder`'s own separate-argv form (no shell) is the safe alternative, not this one."
metadata:
  cwe: ["CWE-78"]
  owasp: ["A03:2021"]
  confidence: HIGH
  references:
    - "https://cwe.mitre.org/data/definitions/78.html"
rule:
  any:
    - pattern: Runtime.getRuntime().exec($CMD)
    - pattern: new ProcessBuilder("sh", "-c", $CMD)
    - pattern: new ProcessBuilder("bash", "-c", $CMD)
constraints:
  CMD:
    regex: '".*"\s*\+'
