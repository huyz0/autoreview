id: kotlin-unreleased-lock
language: Kotlin
category: correctness
severity: error
kind: call-sequence
message: "A `Lock` was acquired but this path returns without releasing it — every other thread that later calls `lock()` on the same lock will block forever (a permanent deadlock), and there's no `finally` block here to guarantee release even when this return is due to an exception. Wrap the critical section in `try { ... } finally { lock.unlock() }`, or prefer Kotlin's `lock.withLock { ... }` extension, which does this for you."
metadata:
  cwe: ["CWE-667"]
  confidence: MEDIUM
after:
  - call: lock
unless:
  - call: unlock
checkBeforeReturn: true
