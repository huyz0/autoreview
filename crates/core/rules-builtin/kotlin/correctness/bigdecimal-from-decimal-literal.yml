id: kotlin-bigdecimal-from-decimal-literal
language: Kotlin
category: correctness
severity: info
message: >-
  This converts a binary floating-point value to BigDecimal and can preserve
  rounding artifacts. Use the string constructor when a decimal literal must
  be represented exactly.
metadata:
  references:
    - https://docs.oracle.com/en/java/javase/19/docs/api/java.base/java/math/BigDecimal.html
rule:
  any:
    - pattern:
        context: "fun f() { val value = java.math.BigDecimal($VALUE) }"
        selector: call_expression
    - all:
        - pattern:
            context: "fun f() { val value = BigDecimal($VALUE) }"
            selector: call_expression
        - inside:
            kind: source_file
            has:
              kind: import_header
              regex: '^import\s+java\.math\.BigDecimal\s*;?$'
              stopBy: end
            stopBy: end
constraints:
  VALUE:
    regex: '^[+-]?(?:[0-9][0-9_]*\.[0-9_]*|\.[0-9][0-9_]*)(?:[eE][+-]?[0-9][0-9_]*)?$'
