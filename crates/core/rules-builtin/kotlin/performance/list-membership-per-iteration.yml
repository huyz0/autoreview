id: kotlin-list-membership-per-iteration
language: Kotlin
category: performance
severity: info
semantic: true
message: >-
  This loop can scan the same list for each element of the input. Consider a set built once
  before the loop when the searched list stays unchanged and the lookup happens often.
metadata:
  references:
    - "https://kotlinlang.org/docs/collections-overview.html#list"
rule:
  all:
    - pattern:
        context: 'fun run() { $HAYSTACK.contains($ARGUMENT) }'
        selector: call_expression
    - has:
        kind: call_suffix
        has:
          kind: value_arguments
          has:
            kind: value_argument
            has:
              kind: simple_identifier
              pattern: $ITEM
    - inside:
        pattern:
          context: 'fun run() { for ($ITEM in $INPUT) { $$$BODY } }'
          selector: for_statement
        stopBy:
          any:
            - kind: lambda_literal
            - kind: function_declaration
    - inside:
        kind: function_declaration
        has:
          kind: function_value_parameters
          has:
            kind: parameter
            all:
              - has:
                  kind: simple_identifier
                  pattern: $HAYSTACK
              - has:
                  kind: user_type
                  regex: '^(kotlin\.collections\.)?List\s*<'
        stopBy:
          any:
            - kind: lambda_literal
            - kind: function_declaration
constraints:
  HAYSTACK:
    kind: simple_identifier
