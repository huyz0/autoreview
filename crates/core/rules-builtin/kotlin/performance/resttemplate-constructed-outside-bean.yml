id: kotlin-resttemplate-constructed-outside-bean
language: Kotlin
category: performance
severity: warning
semantic: true
message: "`RestTemplate` is constructed directly instead of being injected as a Spring-managed `@Bean` — each `RestTemplate()` gets its own `ClientHttpRequestFactory` and, by default, its own connection handling with no pooling shared across calls, so constructing one per request/method call is wasteful and, under load, can exhaust ephemeral ports. Define a single `RestTemplate` `@Bean` (ideally backed by a pooling `ClientHttpRequestFactory`) and inject it instead. (Heuristic: a script/test context may legitimately construct one directly, so this is flagged for a semantic check rather than reported outright.)"
metadata:
  confidence: MEDIUM
rule:
  pattern: RestTemplate($$$ARGS)
  not:
    inside:
      kind: function_declaration
      stopBy: end
      has:
        stopBy: end
        kind: modifiers
        has:
          kind: annotation
          regex: "Bean"
