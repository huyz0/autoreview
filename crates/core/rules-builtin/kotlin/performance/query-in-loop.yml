id: kotlin-query-in-loop
language: Kotlin
category: performance
severity: warning
message: A database query/lookup is issued inside a loop (N+1 query pattern) — batch this into a single query outside the loop instead of round-tripping once per iteration.
rule:
  any:
    - pattern:
        context: "class W { fun w() { val $R = $REPO.findById($$$ARGS) } }"
        selector: property_declaration
      inside: { kind: for_statement, stopBy: end }
    - pattern:
        context: "class W { fun w() { val $R = $DAO.query($$$ARGS) } }"
        selector: property_declaration
      inside: { kind: for_statement, stopBy: end }
