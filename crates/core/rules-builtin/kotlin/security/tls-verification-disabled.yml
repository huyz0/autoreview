id: kotlin-tls-verification-disabled
language: Kotlin
category: security
severity: error
message: "TLS certificate/hostname verification is disabled or bypassed, making the connection vulnerable to man-in-the-middle attacks: either an `X509TrustManager` with an empty `checkServerTrusted`/`checkClientTrusted` body (accepts any certificate chain), a `HostnameVerifier`/OkHttp `hostnameVerifier` lambda that unconditionally returns `true`, or the legacy `ALLOW_ALL_HOSTNAME_VERIFIER` constant. Only acceptable in tests against a known-safe endpoint — delegate to the real verification logic otherwise."
metadata:
  cwe: ["CWE-295"]
  owasp: ["A02:2021"]
  confidence: HIGH
  references:
    - "https://cwe.mitre.org/data/definitions/295.html"
rule:
  any:
    - pattern: $X.setHostnameVerifier(SSLSocketFactory.ALLOW_ALL_HOSTNAME_VERIFIER)
    - pattern: HostnameVerifier { $$$ARGS -> true }
    - pattern: $BUILDER.hostnameVerifier { $$$ARGS -> true }
    - kind: function_declaration
      regex: "check(Server|Client)Trusted"
      has:
        kind: function_body
        not:
          has:
            stopBy: end
            kind: call_expression
