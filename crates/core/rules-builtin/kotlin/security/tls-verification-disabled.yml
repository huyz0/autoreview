id: kotlin-tls-verification-disabled
language: Kotlin
category: security
severity: error
message: ALLOW_ALL_HOSTNAME_VERIFIER disables TLS hostname verification entirely, making the connection vulnerable to man-in-the-middle attacks. Only acceptable in tests against a known-safe endpoint.
rule:
  pattern: $X.setHostnameVerifier(SSLSocketFactory.ALLOW_ALL_HOSTNAME_VERIFIER)
