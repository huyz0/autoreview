id: kotlin-coroutine-launched-in-test-without-runtest
language: Kotlin
category: design
severity: warning
message: "A coroutine builder called directly inside a `@Test` function (outside `runTest { }`) isn't guaranteed to finish before the test method returns — the test can pass or fail nondeterministically depending on scheduling. Wrap the test body in `runTest { }`."
rule:
  any:
    - pattern: launch { $$$BODY }
    - pattern: async { $$$BODY }
  inside:
    stopBy: end
    kind: function_declaration
    has:
      stopBy: end
      kind: modifiers
      has: {stopBy: end, kind: annotation, has: {stopBy: end, kind: type_identifier, regex: ^Test$}}
  not:
    inside:
      stopBy: end
      pattern: runTest { $$$RTBODY }
