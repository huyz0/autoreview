id: go-unclosed-http-response-body
language: Go
category: performance
semantic: true
severity: warning
message: An http.Response is obtained without closing its Body or returning it to the caller. Defer Body.Close after checking the error when this function owns the response.
rule:
  any:
    - pattern:
        context: "func w() { $RESP, $ERR := http.Get($$$ARGS) }"
        selector: short_var_declaration
      not: &response_handled
        any:
          - precedes:
              pattern: "defer $RESP.Body.Close()"
              stopBy: end
          - precedes:
              any:
                - pattern: "return $RESP, nil"
                - pattern: "if $ERR == nil { return $RESP, nil }"
    - pattern:
        context: "func w() { $RESP, $ERR := $CLIENT.Do($$$ARGS) }"
        selector: short_var_declaration
      not: *response_handled
