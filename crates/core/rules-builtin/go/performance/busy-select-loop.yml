id: go-busy-select-loop
language: Go
category: performance
severity: warning
semantic: true
message: >-
  The empty default branch immediately repeats this select while no case is ready. Remove
  default to wait for work, or add a deliberate timer or backoff if polling is required.
metadata:
  references:
    - "https://go.dev/ref/spec#For_statements"
rule:
  kind: for_statement
  regex: '^for\s*\{'
  has:
    field: body
    has:
      kind: statement_list
      has:
        kind: select_statement
        all:
          - has:
              kind: communication_case
          - has:
              kind: default_case
              not:
                has:
                  kind: statement_list
      not:
        has:
          any:
            - all:
                - kind: select_statement
                - follows:
                    kind: select_statement
                    stopBy: end
            - not:
                any:
                  - kind: select_statement
                  - kind: comment
