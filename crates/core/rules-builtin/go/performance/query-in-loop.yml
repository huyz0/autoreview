id: go-query-in-loop
language: Go
category: performance
severity: warning
message: A database query is issued inside a loop (N+1 query pattern) — batch this into a single query outside the loop instead of round-tripping to the database once per iteration.
rule:
  pattern: |
    for $INIT; $COND; $POST {
      $$$
      $A, $B := $DB.Query($$$ARGS)
      $$$
    }
