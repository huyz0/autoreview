id: go-prometheus-high-cardinality-label
language: Go
category: performance
severity: warning
semantic: true
message: >-
  This Prometheus label looks like an unbounded identifier. Each distinct label
  combination creates a time series. Keep metric labels bounded and put
  per-request identifiers in traces or logs.
metadata:
  references:
    - https://prometheus.io/docs/practices/naming/#labels
rule:
  all:
    - pattern: prometheus.$METER($OPTIONS, $LABELS)
    - inside:
        kind: source_file
        has:
          kind: import_spec
          regex: '^"github\.com/prometheus/client_golang/prometheus"$'
          stopBy: end
        stopBy: end
constraints:
  METER:
    regex: '^New(Counter|Gauge|Histogram|Summary)Vec$'
  LABELS:
    all:
      - kind: composite_literal
      - has:
          kind: interpreted_string_literal
          regex: >-
            (?i)^(?:"|')(?:user[_.-]?id|request[_.-]?id|trace[_.-]?id|span[_.-]?id|session[_.-]?id|email|uuid)(?:"|')$
          stopBy: end
