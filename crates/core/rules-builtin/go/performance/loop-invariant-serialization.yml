id: go-loop-invariant-serialization
language: Go
category: performance
semantic: true
severity: warning
message: "json.Marshal is called inside a loop — if its argument doesn't change per iteration, marshal it once before the loop and reuse the bytes. (Heuristic: this rule can't prove the argument is actually loop-invariant, so it's flagged for a semantic check rather than reported outright.)"
rule:
  pattern:
    context: "func w() { $B, $ERR := json.Marshal($ARG) }"
    selector: short_var_declaration
  inside:
    kind: for_statement
    stopBy: end
