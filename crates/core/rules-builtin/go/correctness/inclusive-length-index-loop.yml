id: go-inclusive-length-index-loop
language: Go
category: correctness
severity: warning
semantic: true
message: >-
  The loop includes the collection length, which is one past the last valid element index.
  Use a strict less-than bound or iterate over the items directly.
metadata:
  references:
    - "https://go.dev/ref/spec#For_statements"
rule:
  pattern: "for $INDEX := 0; $INDEX <= len($ITEMS); $INDEX++ { $$$BODY }"
  has:
    field: body
    has:
      pattern: "$ITEMS[$INDEX]"
      stopBy:
        any:
          - kind: func_literal
constraints:
  INDEX:
    kind: identifier
  ITEMS:
    kind: identifier
