id: go-test-without-assertions
language: Go
category: correctness
severity: warning
message: This test function has no assertion (t.Error/t.Errorf/t.Fatal/t.Fatalf, testify assert/require) and no subtests (t.Run) — it will always pass regardless of what the code under test does, giving false confidence. Add an assertion, or remove the test if it's no longer needed.
rule:
  all:
    - kind: function_declaration
    - has:
        field: name
        regex: ^Test
    - has:
        stopBy: end
        kind: parameter_declaration
        regex: testing\.T
    - not:
        has:
          stopBy: end
          kind: call_expression
          regex: ^t\.(Error|Errorf|Fatal|Fatalf|Run)\(|^(assert|require)\.\w+\(
