id: go-direct-unconditional-recursion
language: Go
category: correctness
severity: warning
message: >-
  The only statement calls this function again without a stopping branch. Check whether the
  call should target a different function or whether a base case is missing.
metadata:
  references:
    - "https://go.dev/ref/spec#For_statements"
rule:
  not:
    has:
      field: parameters
      has:
        kind: parameter_declaration
        has:
          field: name
          pattern: $F
  any:
    - pattern: "func $F() { $F() }"
    - pattern: "func $F() $RESULT { return $F() }"
    - pattern: "func $F($P $T) { $F($P) }"
    - pattern: "func $F($P $T) $RESULT { return $F($P) }"
