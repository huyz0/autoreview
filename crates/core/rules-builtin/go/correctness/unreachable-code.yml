id: go-unreachable-code
language: Go
category: correctness
severity: warning
message: This statement immediately follows a return/panic/os.Exit in the same block — it can never execute. Remove it, or move it before the terminating statement if it was meant to run first.
rule:
  any:
    - kind: expression_statement
    - kind: short_var_declaration
    - kind: assignment_statement
    - kind: if_statement
    - kind: for_statement
    - kind: return_statement
    - kind: var_declaration
  follows:
    stopBy: neighbor
    any:
      - kind: return_statement
      - kind: expression_statement
        regex: ^panic\(|^os\.Exit\(
