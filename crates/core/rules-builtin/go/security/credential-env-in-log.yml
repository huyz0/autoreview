id: go-credential-env-in-log
language: Go
category: security
severity: warning
message: >-
  This logging call receives an environment variable named like a credential. Remove its value from the log entry.
metadata:
  cwe: ["CWE-532"]
  references:
    - "https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html#data-to-exclude"
rule:
  all:
    - kind: call_expression
    - has:
        field: function
        regex: '^log\.(Print|Println|Printf|Fatal|Fatalln|Fatalf|Panic|Panicln|Panicf)$'
    - has:
        field: arguments
        has:
          kind: call_expression
          regex: '^os\.Getenv\(\s*"(?:[A-Z0-9_]+_)?(PASSWORD|PASSWD|SECRET|SECRET_KEY|TOKEN|API_KEY|PRIVATE_KEY)"\s*,?\s*\)$'
    - inside:
        stopBy: end
        kind: source_file
        all:
          - has:
              stopBy: end
              kind: import_spec
              regex: '^"log"$'
          - has:
              stopBy: end
              kind: import_spec
              regex: '^"os"$'
