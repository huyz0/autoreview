id: go-sql-string-concat
language: Go
category: security
severity: error
message: A SQL query built via string concatenation is vulnerable to SQL injection — use a parameterized query (?) instead of concatenating user input into the query text.
metadata:
  cwe: ["CWE-89"]
  owasp: ["A03:2021"]
  confidence: HIGH
  references:
    - "https://cwe.mitre.org/data/definitions/89.html"
rule:
  pattern: $A, $B := $DB.Query($QUERY)
constraints:
  QUERY:
    regex: '".*"\s*\+'
