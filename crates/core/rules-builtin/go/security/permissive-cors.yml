id: go-permissive-cors
language: Go
category: security
severity: warning
message: Access-Control-Allow-Origin set to "*" allows any website to make credentialed cross-origin requests to this endpoint — scope it to a known allowlist of origins instead.
metadata:
  cwe: ["CWE-942"]
  owasp: ["A05:2021"]
  confidence: HIGH
  references:
    - "https://cwe.mitre.org/data/definitions/942.html"
rule:
  pattern: $W.Header().Set("Access-Control-Allow-Origin", "*")
