id: go-jwt-parse-unverified
language: Go
category: security
severity: error
message: jwt.ParseUnverified skips signature verification entirely — any attacker-supplied token is accepted as valid. Use jwt.Parse/ParseWithClaims with a real key function instead.
metadata:
  cwe: ["CWE-347"]
  owasp: ["A02:2021"]
  confidence: HIGH
  references:
    - "https://cwe.mitre.org/data/definitions/347.html"
rule:
  pattern: $TOK, $$$REST := jwt.ParseUnverified($$$ARGS)
