id: typescript-direct-unconditional-recursion
language: TypeScript
category: correctness
severity: warning
message: >-
  The only statement calls this function again without a stopping branch. Check whether the
  call should target a different function or whether a base case is missing.
metadata:
  references:
    - "https://tc39.es/ecma262/multipage/ecmascript-language-functions-and-classes.html#sec-function-definitions"
rule:
  not:
    has:
      kind: formal_parameters
      has:
        kind: identifier
        pattern: $F
        stopBy: end
  any:
    - pattern: "function $F() { return $F(); }"
    - pattern: "function $F() { $F(); }"
    - pattern: "function $F($P: $T) { return $F($P); }"
    - pattern: "function $F($P: $T) { $F($P); }"
    - pattern: "function $F(): $R { return $F(); }"
    - pattern: "function $F($P: $T): $R { return $F($P); }"
