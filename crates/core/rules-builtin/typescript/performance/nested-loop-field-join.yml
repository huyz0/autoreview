id: typescript-nested-loop-field-join
language: TypeScript
category: performance
severity: info
semantic: true
message: >-
  The inner loop compares one field from each collection for every pair. Consider indexing
  the inner collection by the compared key if it stays unchanged. Preserve duplicate
  matches, equality, and any required output order.
metadata:
  references:
    - "https://tc39.es/ecma262/multipage/keyed-collections.html#sec-map-objects"
rule:
  pattern: "$OUTER.$FIRST === $INNER.$SECOND"
  not:
    pattern: "$SAME.$FIRST === $SAME.$SECOND"
  inside:
    pattern: "for (const $INNER of $RIGHT) { $$$INNER_BODY }"
    stopBy:
      any:
        - kind: arrow_function
        - kind: function_expression
        - kind: function_declaration
        - kind: method_definition
    inside:
      pattern: "for (const $OUTER of $LEFT) { $$$OUTER_BODY }"
      stopBy:
        any:
          - kind: arrow_function
          - kind: function_expression
          - kind: function_declaration
          - kind: method_definition
constraints:
  OUTER:
    kind: identifier
  INNER:
    kind: identifier
  RIGHT:
    kind: identifier
