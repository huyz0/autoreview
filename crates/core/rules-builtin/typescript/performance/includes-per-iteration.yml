id: typescript-includes-per-iteration
language: TypeScript
category: performance
severity: info
semantic: true
message: >-
  If this receiver is an array, includes can scan it for every input element. Consider a Set
  built once for repeated membership tests against an unchanged array.
metadata:
  references:
    - "https://tc39.es/ecma262/multipage/indexed-collections.html#sec-array.prototype.includes"
rule:
  pattern: $HAYSTACK.includes($ITEM)
  inside:
    any:
      - pattern: for (const $ITEM of $INPUT) { $$$BODY }
      - pattern: for (let $ITEM of $INPUT) { $$$BODY }
    stopBy:
      any:
        - kind: arrow_function
        - kind: function_expression
        - kind: function_declaration
        - kind: method_definition
constraints:
  HAYSTACK:
    kind: identifier
  ITEM:
    kind: identifier
