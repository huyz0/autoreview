id: typescript-regex-compiled-in-loop
language: TypeScript
category: performance
severity: warning
message: A new RegExp is constructed inside a loop — regex compilation is comparatively expensive; hoist the `new RegExp(...)` call outside the loop and reuse it across iterations instead of rebuilding it every time.
rule:
  pattern:
    context: "function f() { const $VAR = new RegExp($$$ARGS); }"
    selector: lexical_declaration
  inside:
    stopBy: end
    any:
      - kind: for_statement
      - kind: for_in_statement
      - kind: while_statement
