id: typescript-command-injection-concat
language: TypeScript
category: security
severity: error
message: A shell command built via string concatenation and passed to `child_process.exec`/`execSync` is vulnerable to command injection — `exec` always runs its argument through a shell. Use `execFile`/`spawn` with a separate argument array instead, which never invokes a shell.
metadata:
  cwe: ["CWE-78"]
  owasp: ["A03:2021"]
  confidence: HIGH
  references:
    - "https://cwe.mitre.org/data/definitions/78.html"
rule:
  any:
    - pattern: exec($CMD)
    - pattern: execSync($CMD)
    - pattern: $CP.exec($CMD)
    - pattern: $CP.execSync($CMD)
constraints:
  CMD:
    regex: '".*"\s*\+'
