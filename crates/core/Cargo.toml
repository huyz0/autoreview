[package]
name = "autoreview-core"
version.workspace = true
edition.workspace = true

[dependencies]
autoreview-schema = { path = "../schema" }
autoreview-archgraph = { path = "../archgraph" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
globset = "0.4"
anyhow = "1"
include_dir = "0.7"
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
tree-sitter = "0.26.11"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"

[dev-dependencies]
autoreview-test-support = { path = "../test-support" }
