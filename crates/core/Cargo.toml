[package]
name = "autoreview-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
autoreview-schema = { path = "../schema" }
autoreview-archgraph = { path = "../archgraph" }
autoreview-symindex = { path = "../symindex" }
autoreview-langsupport = { path = "../langsupport" }
autoreview-dataflow = { path = "../dataflow" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
serde_yaml = "0.9"
sha2 = "0.10"
dirs = "5"
globset = "0.4"
anyhow = "1"
include_dir = "0.7"
tempfile = "3"
rusqlite = { version = "0.41", features = ["bundled"] }
tree-sitter.workspace = true
keyring = { version = "4.1.5", features = ["apple-native-keyring-store"] }
roxmltree = "0.21.1"
yaml-rust2 = { version = "0.13.2", default-features = false }
semver = "1.0.28"

[build-dependencies]
serde_yaml = "0.9"

[dev-dependencies]
autoreview-test-support = { path = "../test-support" }
