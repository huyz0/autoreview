[package]
name = "autoreview-core"
version.workspace = true
edition.workspace = true

[dependencies]
autoreview-schema = { path = "../schema" }
autoreview-archgraph = { path = "../archgraph" }
autoreview-symindex = { path = "../symindex" }
autoreview-langsupport = { path = "../langsupport" }
autoreview-dataflow = { path = "../dataflow" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
dirs = "5"
globset = "0.4"
anyhow = "1"
include_dir = "0.7"
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
tree-sitter.workspace = true
tree-sitter-go.workspace = true
tree-sitter-java.workspace = true
tree-sitter-kotlin-ng.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-javascript.workspace = true
keyring = { version = "4.1.5", features = ["apple-native-keyring-store"] }

[dev-dependencies]
autoreview-test-support = { path = "../test-support" }
