[package]
name = "autoreview-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "autoreview"
path = "src/main.rs"

[dependencies]
autoreview-core = { path = "../core" }
autoreview-langsupport = { path = "../langsupport" }
autoreview-schema = { path = "../schema" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
anyhow = "1"

[dev-dependencies]
autoreview-test-support = { path = "../test-support" }
assert_cmd = "2"
predicates = "3"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
