name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Deliberately absent: a `cargo fmt --check` gate. This was investigated
# rather than assumed — the codebase is hand-formatted with judgment about
# where a compact single line reads better than a split one, and rustfmt
# can't express that. Default settings want to rewrite 1893 places; the
# closest-fitting config found (max_width = 200, use_small_heuristics =
# "Max") still wants 266, and inspecting those showed it making the code
# *worse*: joining readable method chains into 200-character lines and
# exploding compact one-line enum variants across three lines each. A
# reformat that large also destroys `git blame` for no correctness gain.
# Clippy (below) already catches the things that actually matter.

jobs:
  test:
    runs-on: ubuntu-latest
    # A hung subprocess (golangci-lint/ast-grep) shouldn't consume a CI
    # runner indefinitely — well above the ~2min this suite normally
    # takes, so this is a backstop, not a tuned budget.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Go and golangci-lint back two of autoreview's own analyzers
      # (crates/core/src/analyzers/golangci_lint.rs) and the Go-language
      # test fixtures throughout the suite — installed so the tests that
      # exercise those paths actually run instead of gracefully skipping
      # (every such test checks for the tool on PATH first and skips with
      # a clear message rather than failing when it's absent, so CI stays
      # green either way, but installing them here gets real coverage).
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      # The `/v2` in the module path is load-bearing. Go requires a `/vN`
      # suffix for major version 2 and above, so the un-suffixed path
      # resolves to the newest *v1* release — which has no
      # `--output.json.path` flag (v1 used `--out-format`). The analyzer
      # here targets v2, so CI installed a golangci-lint that rejected the
      # only flag this codebase passes it, and four tests failed on every
      # single run from 2026-07-22 until this was fixed.
      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          golangci-lint --version

      # Same reasoning as golangci-lint above, for the ast-grep-dependent
      # pattern-rule tests (rule_pack_conformance.rs and friends).
      - name: Install ast-grep
        run: cargo install ast-grep --locked

      - name: Build
        run: cargo build --workspace --tests --locked

      # --test-threads=4: golangci-lint's own subprocess invocation
      # already retries its transient "no output" failure mode (a
      # contended shared Go build cache under heavy concurrent load —
      # see golangci_lint.rs's own docs), but capping parallelism here is
      # a cheap second layer of defense against the same class of
      # contention, on top of that fix rather than instead of it.
      - name: Test
        run: cargo test --workspace --locked -- --test-threads=4

      - name: Clippy
        run: cargo clippy --workspace --tests --locked -- -D warnings

  # macOS is a supported target (the `keyring` dependency carries an
  # explicit `apple-native-keyring-store` feature for the Keychain, and
  # `auth::credential_store` has `#[cfg(unix)]` paths), but nothing was
  # compiling it — a macOS-only break in credential storage, the most
  # security-sensitive code here, would have shipped undetected.
  #
  # Deliberately does NOT install Go/golangci-lint/ast-grep. Those exist on
  # the Linux job to get real coverage of the subprocess-backed analyzers;
  # duplicating them here would roughly double CI time to re-test
  # platform-independent logic. Every test needing one of those tools checks
  # PATH and skips with a clear message, so this job stays green without
  # them.
  #
  # That claim was originally written as "verified empirically by running
  # the full suite with those tools hidden from PATH". The verification was
  # wrong: the PATH used still contained ~/.cargo/bin, which is where
  # ast-grep lives, so nothing was actually hidden. This job then failed on
  # its first real run against a test that had no ast-grep guard. To check
  # this properly, hide the tools for real:
  #   env -i HOME="$HOME" PATH=/usr/bin:/bin cargo test --workspace
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --tests --locked

      - name: Test
        run: cargo test --workspace --locked -- --test-threads=4

  # Supply-chain gate. This project pulls in `keyring` (OS credential
  # stores), clones third-party rule packs from arbitrary git URLs, and
  # shells out to curl against real APIs — a known-vulnerable transitive
  # dependency matters more here than in a pure library. Passes clean as of
  # this commit (231 dependencies, 0 advisories), so it starts green rather
  # than landing pre-broken.
  #
  # If a future advisory has no fix available and is genuinely not
  # reachable from this codebase, `cargo audit --ignore RUSTSEC-XXXX-NNNN`
  # is the escape hatch — with the reasoning written down next to it, not
  # applied silently.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit
