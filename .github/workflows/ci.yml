name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # A hung subprocess (golangci-lint/ast-grep) shouldn't consume a CI
    # runner indefinitely — well above the ~2min this suite normally
    # takes, so this is a backstop, not a tuned budget.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Go and golangci-lint back two of autoreview's own analyzers
      # (crates/core/src/analyzers/golangci_lint.rs) and the Go-language
      # test fixtures throughout the suite — installed so the tests that
      # exercise those paths actually run instead of gracefully skipping
      # (every such test checks for the tool on PATH first and skips with
      # a clear message rather than failing when it's absent, so CI stays
      # green either way, but installing them here gets real coverage).
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Same reasoning as golangci-lint above, for the ast-grep-dependent
      # pattern-rule tests (rule_pack_conformance.rs and friends).
      - name: Install ast-grep
        run: cargo install ast-grep --locked

      - name: Build
        run: cargo build --workspace --tests --locked

      # --test-threads=4: golangci-lint's own subprocess invocation
      # already retries its transient "no output" failure mode (a
      # contended shared Go build cache under heavy concurrent load —
      # see golangci_lint.rs's own docs), but capping parallelism here is
      # a cheap second layer of defense against the same class of
      # contention, on top of that fix rather than instead of it.
      - name: Test
        run: cargo test --workspace --locked -- --test-threads=4

      - name: Clippy
        run: cargo clippy --workspace --tests --locked -- -D warnings
